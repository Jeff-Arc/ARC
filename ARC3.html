<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARC</title>

  <style>
    /* GLOBAL RESET */
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #050509;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* CHAT CONTAINER */
    #chatContainer {
      flex: 1;
      overflow-y: auto;
      padding: 70px 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    /* MESSAGE BUBBLES */
    .msg {
      max-width: 96%;
      line-height: 1.45;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      opacity: 0;
      animation: fadeLine 0.6s ease forwards;
      margin-bottom: 8px;
    }

    @keyframes fadeLine {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* USER MESSAGE */
    .user {
      align-self: flex-end;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(6px);
      color: #eee;
      padding: 10px 14px;
      border-radius: 14px;
      margin-right: 0;
    }

    /* ARC MESSAGE */
    .bot {
      align-self: flex-start;
      background: transparent;
      color: #eee;
      border: none;
      padding: 8px 0;
      margin-left: 16px;
    }

    /* INPUT BAR */
    #inputBar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: rgba(0,0,0,0.92);
      border-top: 1px solid rgba(255,255,255,0.08);
      z-index: 100;
    }

    #inputWrapper {
      position: relative;
      width: 100%;
      background: #11121a;
      border-radius: 18px;
      padding: 10px 42px 10px 34px;
      display: flex;
      align-items: center;
      box-sizing: border-box;
    }

    #plusInside {
      position: absolute;
      left: 10px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #plusInside svg {
      width: 18px;
      height: 18px;
      stroke: #f2f2f2;
    }

    #textInput {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: #eee;
      font-size: 15px;
      line-height: 1.4;
      overflow-y: hidden;
      padding-right: 32px;
      padding-left: 0;
      box-sizing: border-box;
    }

    #actionBtn {
      position: absolute;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #actionBtn:hover {
      background: rgba(255,255,255,0.14);
    }

    #actionBtn svg {
      width: 18px;
      height: 18px;
      stroke: #f2f2f2;
    }

    /* ATTACHMENT MODAL */
    #attachmentBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 199;
    }

    #attachmentModal {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0d0d12;
      border-radius: 18px 18px 0 0;
      padding: 16px;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.25s ease-out;
      box-sizing: border-box;
    }

    #attachmentHandle {
      width: 40px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 999px;
      margin: 0 auto 14px;
    }

    #attachmentRow {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }

    .attachmentBtn {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 10px 0 8px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .attachmentBtn:hover {
      background: rgba(255,255,255,0.12);
    }

    .attachmentBtn svg {
      width: 22px;
      height: 22px;
      stroke: #f2f2f2;
      margin-bottom: 4px;
    }

    .attachmentLabel {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #generateImageBtn {
      width: 100%;
      background: rgba(255,255,255,0.08);
      padding: 10px;
      border-radius: 14px;
      text-align: center;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-sizing: border-box;
    }

    #generateImageBtn:hover {
      background: rgba(255,255,255,0.14);
    }

    #generateImageBtn svg {
      width: 18px;
      height: 18px;
      stroke: #f2f2f2;
    }

    /* SETTINGS TAB */
    #settingsTab {
      position: fixed;
      top: 20px;
      left: 0;
      width: 20px;
      height: 50px;
      background: rgba(255,255,255,0.06);
      border-radius: 0 12px 12px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 80;
    }

    #settingsTab svg {
      width: 18px;
      height: 18px;
      stroke: #f2f2f2;
    }

    #settingsBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 70;
    }

    #settingsModal {
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      background: #0d0d12;
      padding: 20px;
      border-right: 1px solid rgba(255,255,255,0.08);
      z-index: 71;
      transform: translateX(-100%);
      transition: transform 0.25s ease-out;
      box-sizing: border-box;
    }

    #settingsModal h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 18px;
    }

    #planRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }

    #currentPlan {
      font-size: 13px;
      opacity: 0.85;
    }

    #upgradeBtn {
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: #eee;
      border: none;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }

    #upgradeBtn:hover {
      background: rgba(255,255,255,0.14);
    }

    /* RITUAL OVERLAY */
    #ritualOverlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #3b3f7a 0, #050509 55%, #000 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 16px 24px;
      z-index: 120;
      box-sizing: border-box;
    }

    #ritualCenter {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    #ritualWave {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #6b7bff 0, #1b1f3a 55%, #050509 100%);
      box-shadow: 0 0 40px rgba(88, 101, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    #ritualInnerPulse {
      width: 70%;
      height: 70%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    #ritualCaption {
      margin-top: 18px;
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
      min-height: 20px;
    }

    #ritualBottomBar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #ritualMicBtn {
      width: 80px;
      height: 80px;
      border-radius: 40px;
      border: none;
      background: rgba(255,255,255,0.08);
      color: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    #ritualMicBtn svg {
      width: 26px;
      height: 26px;
      stroke: #f2f2f2;
    }

    #ritualMicLabel {
      font-size: 11px;
      opacity: 0.85;
    }

    /* RITUAL KEYBOARD BUTTON */
    #ritualKeyboardBtn {
      position: absolute;
      right: 6px;
      bottom: -4px;
      width: 32px;
      height: 32px;
      border-radius: 16px;
      border: none;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #ritualKeyboardBtn:hover {
      background: rgba(255,255,255,0.14);
    }

    #ritualKeyboardBtn svg {
      width: 18px;
      height: 18px;
      stroke: #f2f2f2;
    }

    /* HIDDEN FILE INPUTS */
    .hiddenFileInput {
      display: none;
    }

    /* GLOBAL SVG COLOR */
    svg {
      stroke: #f2f2f2;
      fill: none;
    }
  </style>
</head>

<body>
  <!-- Inline SVG symbol library -->
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <!-- Narrative Sequence -->
    <symbol id="icon-narrative-sequence" viewBox="0 0 24 24">
      <rect x="3" y="5" width="5.5" height="8" rx="1.2"/>
      <rect x="9" y="7" width="5.5" height="8" rx="1.2"/>
      <rect x="15" y="9" width="5.5" height="8" rx="1.2"/>
      <path d="M4 19c3 -2 5.5 -1 8 0s4.5 1 8 -1"/>
    </symbol>

    <!-- Plus -->
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>

    <!-- Mic -->
    <symbol id="icon-mic" viewBox="0 0 24 24">
      <rect x="9" y="2" width="6" height="12" rx="3"/>
      <path d="M5 10a7 7 0 0 0 14 0"/>
      <path d="M12 22v-4"/>
    </symbol>

    <!-- Keyboard -->
    <symbol id="icon-keyboard" viewBox="0 0 24 24">
      <rect x="2" y="6" width="20" height="12" rx="2"/>
      <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01"/>
      <path d="M6 14h12"/>
    </symbol>

    <!-- Camera -->
    <symbol id="icon-camera" viewBox="0 0 24 24">
      <path d="M4 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
      <circle cx="12" cy="13" r="4"/>
    </symbol>

    <!-- Image -->
    <symbol id="icon-image" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <path d="M3 15l4-4a2 2 0 0 1 3 0l4 4"/>
      <circle cx="16" cy="9" r="1.5"/>
    </symbol>

    <!-- File -->
    <symbol id="icon-file" viewBox="0 0 24 24">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <path d="M14 2v6h6"/>
    </symbol>

    <!-- Arrow Right -->
    <symbol id="icon-arrow-right" viewBox="0 0 24 24">
      <path d="M9 6l6 6-6 6"/>
    </symbol>

    <!-- Arrow Left -->
    <symbol id="icon-arrow-left" viewBox="0 0 24 24">
      <path d="M15 6l-6 6 6 6"/>
    </symbol>
  </svg>

  <!-- Settings Tab -->
  <div id="settingsTab">
    <svg xmlns="http://www.w3.org/2000/svg">
      <use href="#icon-arrow-right" />
    </svg>
  </div>

  <!-- Chat Container -->
  <div id="chatContainer">
    <div id="chat"></div>
  </div>

  <!-- Input Bar -->
  <div id="inputBar">
    <div id="inputWrapper">
      <div id="plusInside">
        <svg xmlns="http://www.w3.org/2000/svg">
          <use href="#icon-plus" />
        </svg>
      </div>

      <textarea id="textInput" rows="1" placeholder="Message ARC..."></textarea>

      <div id="actionBtn">
        <svg id="actionIcon" xmlns="http://www.w3.org/2000/svg">
          <use href="#icon-mic" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Attachment Modal -->
  <div id="attachmentBackdrop"></div>

  <div id="attachmentModal">
    <div id="attachmentHandle"></div>

    <div id="attachmentRow">
      <div class="attachmentBtn" id="cameraBtn">
        <svg xmlns="http://www.w3.org/2000/svg">
          <use href="#icon-camera" />
        </svg>
        <div class="attachmentLabel">Camera</div>
      </div>

      <div class="attachmentBtn" id="imageBtn">
        <svg xmlns="http://www.w3.org/2000/svg">
          <use href="#icon-image" />
        </svg>
        <div class="attachmentLabel">Image</div>
      </div>

      <div class="attachmentBtn" id="fileBtn">
        <svg xmlns="http://www.w3.org/2000/svg">
          <use href="#icon-file" />
        </svg>
        <div class="attachmentLabel">File</div>
      </div>
    </div>

    <div id="generateImageBtn">
      <svg xmlns="http://www.w3.org/2000/svg">
        <use href="#icon-narrative-sequence" />
      </svg>
      <span>Generate Narrative Sequence</span>
    </div>
  </div>

  <!-- Hidden Inputs -->
  <input id="cameraInput" class="hiddenFileInput" type="file" accept="image/*" capture="environment" />
  <input id="imageInput" class="hiddenFileInput" type="file" accept="image/*" />
  <input id="fileInput" class="hiddenFileInput" type="file" />

  <!-- Settings Modal -->
  <div id="settingsBackdrop"></div>

  <div id="settingsModal">
    <h2>Settings</h2>
    <div id="planRow">
      <div id="currentPlan">Current Plan: Legacy Account (12 Users)</div>
      <button id="upgradeBtn">Upgrade</button>
    </div>
  </div>

  <!-- Ritual Overlay -->
  <div id="ritualOverlay">
    <div id="ritualCenter">
      <div id="ritualWave">
        <div id="ritualInnerPulse"></div>
      </div>
      <div id="ritualCaption"></div>
    </div>

    <div id="ritualBottomBar">
      <button id="ritualMicBtn">
        <svg xmlns="http://www.w3.org/2000/svg">
          <use href="#icon-mic" />
        </svg>
        <div id="ritualMicLabel">Hold</div>
      </button>

      <button id="ritualKeyboardBtn">
        <svg xmlns="http://www.w3.org/2000/svg">
          <use href="#icon-keyboard" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    /* ELEMENT REFERENCES */
    const chat = document.getElementById("chat");
    const textInput = document.getElementById("textInput");
    const actionBtn = document.getElementById("actionBtn");
    const actionIcon = document.getElementById("actionIcon");
    const plusInside = document.getElementById("plusInside");
    const attachmentModal = document.getElementById("attachmentModal");
    const attachmentBackdrop = document.getElementById("attachmentBackdrop");
    const generateImageBtn = document.getElementById("generateImageBtn");
    const cameraBtn = document.getElementById("cameraBtn");
    const imageBtn = document.getElementById("imageBtn");
    const fileBtn = document.getElementById("fileBtn");
    const cameraInput = document.getElementById("cameraInput");
    const imageInput = document.getElementById("imageInput");
    const fileInput = document.getElementById("fileInput");
    const settingsModal = document.getElementById("settingsModal");
    const settingsBackdrop = document.getElementById("settingsBackdrop");
    const settingsTab = document.getElementById("settingsTab");
    const ritualOverlay = document.getElementById("ritualOverlay");
    const ritualMicBtn = document.getElementById("ritualMicBtn");
    const ritualKeyboardBtn = document.getElementById("ritualKeyboardBtn");
    const ritualCaption = document.getElementById("ritualCaption");
    const ritualWave = document.getElementById("ritualWave");
    const inputBar = document.getElementById("inputBar");

    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let settingsOpen = false;

    const API_BASE = "https://arc-tech-fucwbde2hgdneqc8.northeurope-01.azurewebsites.net";

    /* INITIAL MESSAGE */
    addMessage("Welcome back Jeff", "bot");

    /* MESSAGE CREATION */
    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.textContent = text;
      chat.appendChild(div);

      setTimeout(() => {
        const container = document.getElementById("chatContainer");
        container.scrollTop = container.scrollHeight;
      }, 600);
    }

    /* TEXTAREA AUTO-EXPAND + MIC/SEND TOGGLE */
    textInput.addEventListener("input", () => {
      textInput.style.height = "auto";
      textInput.style.height = textInput.scrollHeight + "px";

      const hasText = textInput.value.trim().length > 0;
      actionIcon.innerHTML = "";

      if (hasText) {
        actionIcon.insertAdjacentHTML("beforeend", '<use href="#icon-arrow-right" />');
      } else {
        actionIcon.insertAdjacentHTML("beforeend", '<use href="#icon-mic" />');
      }
    });

    /* ACTION BUTTON */
    actionBtn.addEventListener("click", () => {
      if (textInput.value.trim().length > 0) {
        sendTextMessage();
      } else {
        openRitualOverlay();
      }
    });

    /* SEND TEXT MESSAGE */
    async function sendTextMessage() {
      const text = textInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      textInput.value = "";
      textInput.style.height = "auto";

      actionIcon.innerHTML = '<use href="#icon-mic" />';

      try {
        const response = await fetch(`${API_BASE}/submit-text`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        const data = await response.json();
        addMessage("Job created with ID: " + data.job_id, "bot");
      } catch (err) {
        addMessage("Error: " + err.message, "bot");
      }
    }

    /* ATTACHMENT MODAL */
    plusInside.addEventListener("click", () => {
      attachmentBackdrop.style.display = "block";
      requestAnimationFrame(() => {
        attachmentModal.style.transform = "translateY(0)";
      });
    });

    attachmentBackdrop.addEventListener("click", () => {
      attachmentModal.style.transform = "translateY(100%)";
      setTimeout(() => attachmentBackdrop.style.display = "none", 250);
    });

    generateImageBtn.addEventListener("click", () => {
      textInput.value = "Generate a Narrative Sequence about my ";
      textInput.focus();
      textInput.dispatchEvent(new Event("input"));

      attachmentModal.style.transform = "translateY(100%)";
      setTimeout(() => attachmentBackdrop.style.display = "none", 250);
    });

    /* ATTACHMENT BUTTON BEHAVIOR */
    cameraBtn.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });

        attachmentModal.style.transform = "translateY(100%)";
        setTimeout(() => attachmentBackdrop.style.display = "none", 250);

        addMessage("Camera activated", "bot");
        stream.getTracks().forEach(t => t.stop());
      } catch (err) {
        cameraInput.click();
      }
    });

    imageBtn.addEventListener("click", () => imageInput.click());
    fileBtn.addEventListener("click", () => fileInput.click());

    /* SETTINGS TAB + MODAL */
    settingsTab.addEventListener("click", () => {
      if (!settingsOpen) openSettings();
      else closeSettings();
    });

    function openSettings() {
      settingsBackdrop.style.display = "block";
      settingsModal.style.transform = "translateX(0)";
      settingsOpen = true;

      settingsTab.innerHTML =
        '<svg xmlns="http://www.w3.org/2000/svg"><use href="#icon-arrow-left" /></svg>';
    }

    function closeSettings() {
      settingsModal.style.transform = "translateX(-100%)";
      setTimeout(() => {
        settingsBackdrop.style.display = "none";
      }, 250);

      settingsOpen = false;

      settingsTab.innerHTML =
        '<svg xmlns="http://www.w3.org/2000/svg"><use href="#icon-arrow-right" /></svg>';
    }

    settingsBackdrop.addEventListener("click", closeSettings);

    /* RITUAL OVERLAY */
    function openRitualOverlay() {
      ritualOverlay.style.display = "flex";
      inputBar.style.display = "none";
      ritualCaption.textContent = "";
    }

    function closeRitualOverlay() {
      ritualOverlay.style.display = "none";
      inputBar.style.display = "block";
      ritualWave.classList.remove("listening", "speaking");
      ritualCaption.textContent = "";
    }

    ritualKeyboardBtn.addEventListener("click", closeRitualOverlay);

    /* AUDIO RECORDING */
    ritualMicBtn.addEventListener("mousedown", () => startRecording());
    ritualMicBtn.addEventListener("mouseup", () => stopRecording());
    ritualMicBtn.addEventListener("mouseleave", () => stopRecording());

    async function startRecording() {
      if (isRecording) return;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          handleAudioStop();
        };

        mediaRecorder.start();
        isRecording = true;
        ritualCaption.textContent = "Listening…";
      } catch (err) {
        addMessage("Mic error: " + err.message, "bot");
      }
    }

    function stopRecording() {
      if (!mediaRecorder || !isRecording) return;

      mediaRecorder.stop();
      isRecording = false;

      ritualCaption.textContent = "Sending…";
      setTimeout(() => {
        ritualCaption.textContent = "";
      }, 1200);
    }

    async function handleAudioStop() {
      const blob = new Blob(audioChunks, { type: "audio/webm" });

      addMessage("Audio recorded (" + Math.round(blob.size / 1024) + " KB)", "user");

      try {
        const form = new FormData();
        form.append("file", blob, "audio.webm");

        const response = await fetch(`${API_BASE}/upload-audio`, {
          method: "POST",
          body: form
        });

        const data = await response.json();
        addMessage("Audio job created with ID: " + data.job_id, "bot");
      } catch (err) {
        addMessage("Error sending audio: " + err.message, "bot");
      }
    }

    /* START IN RITUAL MODE */
    openRitualOverlay();
  </script>
</body>
</html>
